name: Aggiungi Parola a CSV da Telegram

on:
  # Questo trigger è essenziale per accettare la richiesta POST da Make (Webhooks)
  repository_dispatch:
    # Il valore in 'types' DEVE CORRISPONDERE esattamente a 'event_type'
    # inviato nel body JSON da Make (es. "telegram_update_csv").
    types: [telegram_update_csv]

jobs:
  update-csv:
    # Esegui l'azione sull'ultima versione di Ubuntu
    runs-on: ubuntu-latest
    
    # I passaggi (steps) per aggiornare il file
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        
      - name: Estrai la parola dal payload
        id: extract_word
        run: |
          # Il dato che ci interessa è contenuto in 'client_payload.word_to_add'
          # che Make ha inviato. 
          # Variabile d'ambiente: github.event.client_payload.word_to_add
          
          WORD="${{ github.event.client_payload.word_to_add }}"
          echo "La parola estratta è: $WORD"
          
          # Passa la parola come output per i passi successivi
          echo "word=$WORD" >> $GITHUB_OUTPUT

      - name: Aggiungi la parola al CSV
        run: |
          # Aggiunge la parola al file dati.csv, con una nuova riga
          echo "${{ steps.extract_word.outputs.word }}" >> dati.csv
          
      - name: Commit e push
        # Usa un'azione esterna per committare e fare il push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Aggiunto da Telegram: ${{ steps.extract_word.outputs.word }}'
          commit_author: 'Telegram Bot <action@github.com>'
          # Utilizza il Secret creato nel repository
          token: ${{ secrets.REPO_PAT }}
