name: Aggiungi Parola, Audio e Video

on:
  repository_dispatch:
    types: [telegram_trigger]
  workflow_dispatch:
    inputs:
      parola_russo:
        description: 'Parola da elaborare'
        required: true
        type: string

permissions:
  contents: write

jobs:
  process-word:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set environment variables
        run: |
          echo "WORD=${{ github.event.inputs.parola_russo || github.event.client_payload.parola_russo }}" >> $GITHUB_ENV
          echo "CHAT_ID=${{ github.event.inputs.chat_id || github.event.client_payload.chat_id }}" >> $GITHUB_ENV

      - name: Run Python in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            ghcr.io/${{ github.repository }}/wordbot:latest \
            python append_word.py "$WORD" "$CHAT_ID"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add parole.csv
          git commit -m "Aggiunta parola e video per: $WORD" || exit 0

          git pull --rebase origin main
          git push origin HEAD:main
