name: Aggiungi Parola, Audio e Video

on:
  repository_dispatch:
    types: [telegram_trigger]
  workflow_dispatch:
    inputs:
      parola_russo:
        description: 'Parola da elaborare'
        required: true
        type: string
      chat_id:
        description: 'ID Chat Telegram'
        required: false
        type: string

permissions:
  contents: write
  packages: read

jobs:
  process-word:
    runs-on: ubuntu-latest
    # Il container viene avviato una sola volta all'inizio del job
    container:
      image: ghcr.io/${{ github.repository }}/wordbot:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Elaborazione Video e Python
        env:
          WORD: ${{ github.event.inputs.parola_russo || github.event.client_payload.parola_russo }}
          CHAT_ID: ${{ github.event.inputs.chat_id || github.event.client_payload.chat_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== START PROCESSING ==="
          # Usiamo il tempo di sistema per monitorare lo script
          python append_word.py "$WORD" "$CHAT_ID"
          echo "=== END PROCESSING ==="

      - name: Commit & Push Changes
        run: |
          # Indispensabile per evitare errori di permessi Git dentro il container
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Aggiunge il file CSV modificato e i nuovi file generati
          git add parole.csv
          
          # Se non ci sono modifiche (es. parola duplicata), non fallire
          git commit -m "Aggiunta parola e video per: ${WORD:-dispatch}" || exit 0
          
          git pull --rebase origin main
          git push origin HEAD:main
