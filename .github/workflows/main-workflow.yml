name: Aggiungi Parola, Audio e Video

on:
  repository_dispatch:
    types: [telegram_trigger]
  workflow_dispatch:
    inputs:
      parola_russo:
        description: 'Parola da elaborare'
        required: true
        type: string

permissions:
  contents: write

jobs:
  process-word:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/${{ github.repository }}/wordbot:latest
      options: >-
        -v ${{ github.workspace }}:/github/workspace

    steps:
      # ───────── Checkout repo ─────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ───────── Estrai dati input ─────────
      - name: Extract Input
        id: get_data
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "WORD=${{ github.event.client_payload.parola_russo }}" >> $GITHUB_ENV
            echo "CHAT_ID=${{ github.event.client_payload.chat_id }}" >> $GITHUB_ENV
          else
            echo "WORD=${{ github.event.inputs.parola_russo }}" >> $GITHUB_ENV
            echo "CHAT_ID=" >> $GITHUB_ENV
          fi

      # ───────── Esegui script Python nel container ─────────
      - name: Run Main Script
        working-directory: /github/workspace
        run: python3 append_word.py "$WORD" "$CHAT_ID"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      # ───────── Commit & Push ─────────
      - name: Commit & Push Changes
        working-directory: /github/workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add parole.csv
          git commit -m "Aggiunta parola e video per: $WORD" || exit 0

          git pull --rebase origin main
          git push origin HEAD:main
