name: Aggiungi Parola, Audio e Video

on:
  repository_dispatch:
    types: [telegram_trigger]
  workflow_dispatch:
    inputs:
      parola_russo:
        description: 'Parola da elaborare'
        required: true
        type: string

permissions:
  contents: write

jobs:
  process-word:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/${{ github.repository }}/wordbot:latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Estrai Dati Input
        id: get_data
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "word=${{ github.event.client_payload.parola_russo }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ github.event.client_payload.chat_id }}" >> $GITHUB_OUTPUT
          else
            echo "word=${{ github.event.inputs.parola_russo }}" >> $GITHUB_OUTPUT
            echo "chat_id=" >> $GITHUB_OUTPUT
          fi

      - name: Run Main Script
        run: python append_word.py "${{ steps.get_data.outputs.word }}" "${{ steps.get_data.outputs.chat_id }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add parole.csv
          git commit -m "Aggiunta parola e video per: ${{ steps.get_data.outputs.word }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
