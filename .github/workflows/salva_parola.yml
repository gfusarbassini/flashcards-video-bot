name: Aggiungi Parola a CSV tramite Input o Telegram

on:
  workflow_dispatch:
    inputs:
      parola_russo:
        description: 'La parola russa da salvare'
        required: true
        type: string
  repository_dispatch:
    types: [telegram_trigger]

permissions:
  contents: write

jobs:
  add-word:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Libraries
        run: pip install pandas google-genai gTTS requests pydub cairosvg moviepy

      - name: Run Script
        run: python3 append_word.py "${{ steps.get_data.outputs.word }}" "${{ steps.get_data.outputs.chat_id }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add parole.csv
          git commit -m "Aggiunta parola e video per: ${{ steps.get_data.outputs.word }}" || echo "No changes"
          git push
