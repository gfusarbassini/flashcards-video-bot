name: Salva Parola Russa da Telegram

# Questo workflow si attiva solo manualmente tramite API call (workflow_dispatch)
on:
  workflow_dispatch:
    inputs:
      parola_russo:
        description: 'La parola in russo inviata dal bot Telegram.'
        required: true
        type: string

jobs:
  append_to_csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        # Scarica il repository per poter modificare i file
        uses: actions/checkout@v4
        # Necessario per i commit/push
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Configura Git
        # Configura l'utente che farà il commit
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      - name: Verifica e crea il file CSV (se non esiste)
        run: |
          FILE="test_parole.csv"
          # Controlla se il file esiste e ha intestazioni, altrimenti lo crea
          if [ ! -f $FILE ] || ! head -1 $FILE | grep -q "Parola"; then
            echo "Parola,Timestamp" > $FILE
          fi
          
      - name: Aggiungi la parola al CSV
        id: append_word
        run: |
          # Ottieni l'input passato dal bot
          PAROLA="${{ github.event.inputs.parola_russo }}"
          # Ottieni il timestamp attuale
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Aggiungi la nuova riga al file CSV
          echo "$PAROLA,$TIMESTAMP" >> test_parole.csv
          
      - name: Commit e push delle modifiche
        # Esegue il commit solo se ci sono state modifiche
        run: |
          git add test_parole.csv
          git commit -m "Aggiunta parola russa: ${{ github.event.inputs.parola_russo }} [skip ci]"
          git push
