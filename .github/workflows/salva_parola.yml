name: Aggiungi Parola a CSV tramite Input

on:
  workflow_dispatch:
    inputs:
      parola_russo:
        description: 'La parola russa da salvare'
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-word:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas google-genai

      - name: Run append script
        run: python3 append_word.py "${{ github.event.inputs.parola_russo }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit aggiornamento
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add parole.csv
          git commit -m "Aggiunta nuova parola: ${{ github.event.inputs.parola_russo }}" || echo "Nessun cambiamento da committare"
          git push
