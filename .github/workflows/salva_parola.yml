name: Aggiungi Parola a CSV tramite Input

on:
  workflow_dispatch:
    inputs:
      new_word:
        description: 'La parola da aggiungere a test_parole.csv'
        required: true
        type: string

permissions:
  contents: write # Permesso necessario per il commit

jobs:
  add-word:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installazione di Pandas (necessario per manipolare CSV in Python)
      - name: Install dependencies
        run: pip install pandas

      # Esegue lo script Python, passando la parola come argomento
      - name: Esegui script di aggiunta
        run: python3 append_word.py "${{ github.event.inputs.new_word }}"

      - name: Commit aggiornamento
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Aggiunge solo il file CSV che hai modificato
          git add test_parole.csv
          git commit -m "Aggiunta nuova parola: ${{ github.event.inputs.new_word }}" || echo "Nessun cambiamento da committare"
          git push
