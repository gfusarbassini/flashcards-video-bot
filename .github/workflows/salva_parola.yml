name: Aggiungi Parola a CSV

on:
  workflow_dispatch:
    inputs:
      new_word:
        description: 'La nuova parola da aggiungere al file test_parole.csv'
        required: true
        type: string

permissions:
  contents: write # Serve per l'azione di commit

jobs:
  add-word:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Utilizza un'azione per manipolare i file CSV
      - name: Aggiungi la parola al CSV e fai il commit
        uses: csv-actions/csv-actions@v1.4.0
        with:
          # Il file CSV target
          filename: test_parole.csv
          # L'azione è "append" (aggiungi)
          action: append
          # I dati da aggiungere. Deve corrispondere alle colonne del tuo CSV.
          # Ad esempio, se il tuo CSV ha una colonna "Parola", usa 'Parola':
          data: |
            "Parola":"${{ github.event.inputs.new_word }}"
          # Configurazione per il commit
          commit_message: "Aggiunta nuova parola: ${{ github.event.inputs.new_word }}"
          github_token: ${{ secrets.ACCESS_TOKEN }} # Token predefinito per il commit
