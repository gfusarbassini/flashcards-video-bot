name: Aggiungi Parola a CSV tramite Input o Telegram

on:
  workflow_dispatch:
    inputs:
      parola_russo:
        description: 'La parola russa da salvare'
        required: true
        type: string
  repository_dispatch:
    types: [telegram_trigger]

permissions:
  contents: write

jobs:
  add-word:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get install -y ffmpeg
          pip install pandas google-genai gTTS requests pydub

      - name: Estrai Parola e ChatID
        id: get_data
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "word=${{ github.event.client_payload.parola_russo }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ github.event.client_payload.chat_id }}" >> $GITHUB_OUTPUT
          else
            echo "word=${{ github.event.inputs.parola_russo }}" >> $GITHUB_OUTPUT
            echo "chat_id=''" >> $GITHUB_OUTPUT
          fi

      - name: Run append script
        run: python3 append_word.py "${{ steps.get_data.outputs.word }}" "${{ steps.get_data.outputs.chat_id }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      - name: Commit aggiornamento
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add parole.csv
          git commit -m "Aggiunta nuova parola: ${{ steps.get_word.outputs.word }}" || echo "Nessun cambiamento da committare"
          git push
