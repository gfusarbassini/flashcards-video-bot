name: Aggiungi Parola, Audio e Video

on:
  repository_dispatch:
    types: [telegram_trigger]
  workflow_dispatch:
    inputs:
      parola_russo:
        description: 'Parola da elaborare'
        required: true
        type: string

permissions:
  contents: write

jobs:
  process-word:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev imagemagick

      - name: Fix ImageMagick Policy
        run: |
          # Rimuove i blocchi di sicurezza di ImageMagick su Ubuntu per permettere la manipolazione dei file
          sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml
          sudo sed -i 's/domain="coder" rights="none" pattern="LABEL"/domain="coder" rights="read|write" pattern="LABEL"/' /etc/ImageMagick-6/policy.xml

      - name: Install Unbounded Font
        run: |
          mkdir -p ~/.local/share/fonts
          # Scarica il font Unbounded direttamente da Google Fonts (GitHub Mirror)
          wget -O ~/.local/share/fonts/Unbounded.ttf "https://github.com/google/fonts/raw/main/ofl/unbounded/Unbounded%5Bwght%5D.ttf"
          # Aggiorna la cache dei font di sistema
          fc-cache -f -v
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Libraries
        run: |
          pip install pandas google-genai gTTS requests pydub cairosvg
          pip install "moviepy==1.0.3"
          pip install "decorator<5.0.0"

      - name: Estrai Dati Input
        id: get_data
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "word=${{ github.event.client_payload.parola_russo }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ github.event.client_payload.chat_id }}" >> $GITHUB_OUTPUT
          else
            echo "word=${{ github.event.inputs.parola_russo }}" >> $GITHUB_OUTPUT
            echo "chat_id=''" >> $GITHUB_OUTPUT
          fi

      - name: Run Main Script
        run: python3 append_word.py "${{ steps.get_data.outputs.word }}" "${{ steps.get_data.outputs.chat_id }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add parole.csv
          # Il comando commit non fallisce se non ci sono cambiamenti
          git commit -m "Aggiunta parola e video per: ${{ steps.get_data.outputs.word }}" || echo "Nessun cambiamento da salvare"
          git push
